# Production: PostgreSQL (e.g. Neon) with settings from environment variables.
# DATABASE_URL must be the JDBC form, e.g.
#   jdbc:postgresql://ep-example-123.us-east-2.aws.neon.tech/neondb?sslmode=require
# (Neon shows a postgresql:// URL; drop the user:password@ part and add the jdbc: prefix.)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Neon's free tier allows few connections and suspends when idle; a small pool is plenty
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# Hosts like Render assign the port through $PORT
server.port=${PORT:8080}
# Render terminates TLS and forwards the original scheme and host
server.forward-headers-strategy=framework

# The frontend is served by this app, so it is same-origin; set this only if the
# frontend is hosted elsewhere (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Health endpoint for the host's health checks, without internal details
management.endpoint.health.show-details=never
