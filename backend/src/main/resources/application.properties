spring.application.name=backend
spring.profiles.default=dev

server.port=8080

# Frontend dev server origin allowed by CORS
app.cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health

spring.jpa.open-in-view=false
# Flyway (db/migration) owns the schema; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Batch inserts so the ~12k-row player sync is a few hundred statements, not thousands
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

sleeper.base-url=https://api.sleeper.app/v1
# Weekly stats, projections and the schedule are served from Sleeper's
# undocumented api.sleeper.com host. Features using them degrade if it changes.
sleeper.stats-base-url=https://api.sleeper.com
# Sleeper omits numeric fields that have no value yet (e.g. fpts_against before a
# league's first game). Jackson 3 rejects a missing value for a primitive int by
# default; read it as 0 instead.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Sleeper asks that /players/nfl be fetched at most once a day. The sync runs on
# startup and hourly, but only downloads when the stored copy is older than max-age.
app.players.sync-enabled=true
app.players.max-age=24h
app.players.sync-check-cron=0 0 * * * *
